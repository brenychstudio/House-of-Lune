name: brenych-foundation

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: brenych_test
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      PGTZ: UTC
      TZ: UTC
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brenych_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - brenych_postgres_data:/var/lib/postgresql/data

volumes:
  brenych_postgres_data:
